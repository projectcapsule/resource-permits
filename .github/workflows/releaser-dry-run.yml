name: GoReleaser Dry Run
on:
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/workflows/releaser*.yml'
      - '.goreleaser.yml'
      - 'Taskfile.yml'
      - 'devbox.*'
      - 'api/**'
      - 'pkg/**'
      - 'cmd/**'
      - 'internal/**'
      - 'headlamp/**'
      - 'go.*'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Report disk availability before setup
        run: |
          df -h / /tmp
          df -i / /tmp
      - uses: ./.github/actions/setup
        with:
          cache-scope: release
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Validate and build release artifacts
        run: |
          df -h / /tmp
          df -i / /tmp
          devbox run -- task release:snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Report final disk availability
        if: always()
        run: |
          df -h / /tmp
          df -i / /tmp
