name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  # All tags update the same Artifact Hub branch.
  group: release-publication
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Report disk availability before setup
        run: |
          df -h / /tmp
          df -i / /tmp
      - uses: ./.github/actions/setup
        with:
          cache-scope: release
      - uses: creekorful/goreportcard-action@1f35ced8cdac2cba28c9a2f2288a16aacfd507f9 # v1.0
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Publish release artifacts
        run: |
          df -h / /tmp
          df -i / /tmp
          devbox run -- task release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Headlamp metadata
        uses: projectcapsule/github-actions/headlamp-publish@88b19103c6f3a8e6ab172bc17d4bfd181ac37118
        with:
          build-root: headlamp/
          archive: dist/resource-permits-*.tar.gz
          target-branch: headlamp-plugin
          node-version: '24.21.0'
          metadata-template: artifacthub-pkg.yml
      - name: Report final disk availability
        if: always()
        run: |
          df -h / /tmp
          df -i / /tmp
