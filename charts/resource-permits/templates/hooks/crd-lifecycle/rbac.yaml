{{- if and .Values.crds.install (not $.Values.crds.inline) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "resource-permits.crds.name" . }}
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    # create hook dependencies in the right order
    "helm.sh/hook-weight": "-3"
    {{- include "resource-permits.crds.annotations" . | nindent 4 }}
  labels:
    app.kubernetes.io/component: {{ include "resource-permits.crds.component" . | quote }}
    {{- include "resource-permits.labels" . | nindent 4 }}
rules:
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  resourceNames:
  - resourcepermits.addons.projectcapsule.dev
  - resourcepermittemplates.addons.projectcapsule.dev
  - globalresourcepermittemplates.addons.projectcapsule.dev
  verbs:
  - create
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "resource-permits.crds.name" . }}
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    # create hook dependencies in the right order
    "helm.sh/hook-weight": "-2"
    {{- include "resource-permits.crds.annotations" . | nindent 4 }}
  labels:
    app.kubernetes.io/component: {{ include "resource-permits.crds.component" . | quote }}
    {{- include "resource-permits.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "resource-permits.crds.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "resource-permits.crds.name" . }}
    namespace: {{ .Release.Namespace | quote }}
{{- end }}
